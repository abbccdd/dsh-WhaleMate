# ============================================================================
# dsh-pond —— DSH bundle patch
# ============================================================================
# 插件挂载声明：DSH 启动时把本插件插进 profile 的配置树。
#
# 安装（本地开发，link 到源码目录）：
#   双击项目根目录的“一键安装.cmd”，或在插件目录使用 link 安装。
# 查看已装：
#   dsh plugin --profile web ls
# 卸载：
#   dsh plugin --profile web remove dsh-pond
#
# ⚠️ `name:` 必须与安装后的**包名**完全一致（这里是 dsh-pond）。
# 装完重启 DSH 后：工具列表里出现 pond；HTTP API 在 /dsh-pond/api；
# 在 DSH「设置 → 鲸伴」中可管理素材清理和 QQ 分享开关。
# ============================================================================

- insert:
    - id: dsh-pond
      name: dsh-pond
